<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F7F7F2; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #F7F7F2; }
      #root > div.clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Root duration = voice length + ~3.5 s hold. One host per scene; host id = data-composition-id = scene file name.
         z-index rises with scene order so a later scene paints over an earlier one at the seam. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080" data-motion-blur="on">
      <div id="s1" data-composition-id="s1" class="clip" data-composition-src="compositions/s1.html" data-start="0" data-duration="12" data-track-index="1" data-track-kind="graphics" style="z-index:1"></div>
      <div id="s2" data-composition-id="s2" class="clip" data-composition-src="compositions/s2.html" data-start="12" data-duration="18" data-track-index="1" data-track-kind="graphics" style="z-index:2"></div>
      <audio id="vo" class="clip" src="assets/audio/voice.wav" data-start="0" data-duration="26.5" data-track-index="2" data-volume="1"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="5.78" data-duration="0.57" data-track-index="3" data-volume="0.16"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="11.88" data-duration="0.57" data-track-index="3" data-volume="0.16"></audio>
      <audio id="sfx-p1" class="clip" src="assets/sfx/pop.mp3" data-start="17.0" data-duration="0.72" data-track-index="4" data-volume="0.16"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
